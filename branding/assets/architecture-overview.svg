<svg width="1200" height="580" viewBox="0 0 1200 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="580" rx="28" fill="#F4F7F9"/>
  <rect x="34" y="34" width="1132" height="512" rx="22" fill="#FFFFFF" stroke="#D6DEE5" stroke-width="2"/>
  <text x="70" y="92" fill="#1F2933" font-size="34" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">GridPilot MCP Architecture</text>
  <text x="70" y="126" fill="#52616F" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">A controlled bridge between coding agents and live desktop Excel.</text>

  <g transform="translate(86 192)">
    <rect width="184" height="132" rx="20" fill="#08131E"/>
    <text x="28" y="42" fill="#22D3EE" font-size="15" font-family="JetBrains Mono, Consolas, monospace">CLIENT</text>
    <text x="28" y="68" fill="#F6F7F8" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="28" dy="0">Agent /</tspan>
      <tspan x="28" dy="28">Codex</tspan>
    </text>
    <text x="28" y="110" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="28" dy="0">Prompts, tools, and</tspan>
      <tspan x="28" dy="20">MCP calls</tspan>
    </text>
  </g>
  <g transform="translate(318 192)">
    <rect width="196" height="132" rx="20" fill="#0E2432"/>
    <text x="28" y="42" fill="#3DD598" font-size="15" font-family="JetBrains Mono, Consolas, monospace">TRANSPORT</text>
    <text x="28" y="74" fill="#F6F7F8" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif">MCP Host</text>
    <text x="28" y="102" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="28" dy="0">stdio server, routing,</tspan>
      <tspan x="28" dy="20">and argument handling</tspan>
    </text>
  </g>
  <g transform="translate(562 192)">
    <rect width="228" height="132" rx="20" fill="#0B1C28"/>
    <text x="28" y="42" fill="#3DD598" font-size="15" font-family="JetBrains Mono, Consolas, monospace">CONTROL PLANE</text>
    <text x="28" y="74" fill="#F6F7F8" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif">Bridge Services</text>
    <text x="28" y="102" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="28" dy="0">Safety, validation, saves,</tspan>
      <tspan x="28" dy="20">and diagnostics</tspan>
    </text>
  </g>
  <g transform="translate(838 192)">
    <rect width="196" height="132" rx="20" fill="#0E2432"/>
    <text x="28" y="42" fill="#22D3EE" font-size="15" font-family="JetBrains Mono, Consolas, monospace">INTEROP</text>
    <text x="28" y="74" fill="#F6F7F8" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif">COM Adapter</text>
    <text x="28" y="102" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="28" dy="0">Isolated Excel COM</tspan>
