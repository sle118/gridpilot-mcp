    </text>
  </g>
  <g transform="translate(462 382)">
    <rect width="278" height="120" rx="18" fill="#F8FBFC" stroke="#D6DEE5"/>
    <text x="24" y="36" fill="#1F2933" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Observability</text>
    <text x="24" y="70" fill="#52616F" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">Runtime logging and structured results</tspan>
      <tspan x="24" dy="22">without polluting MCP stdout.</tspan>
    </text>
  </g>
  <g transform="translate(816 382)">
    <rect width="278" height="120" rx="18" fill="#F8FBFC" stroke="#D6DEE5"/>
    <text x="24" y="36" fill="#1F2933" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">Workbook Surface</text>
    <text x="24" y="70" fill="#52616F" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">
