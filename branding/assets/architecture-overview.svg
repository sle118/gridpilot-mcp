<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="52%" stop-color="#0B1F24"/>
      <stop offset="100%" stop-color="#0E302C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14343B"/>
      <stop offset="100%" stop-color="#0D2429"/>
    </linearGradient>
    <linearGradient id="pilotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79FFE1"/>
      <stop offset="100%" stop-color="#2CD3A3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1B3B40" opacity="0.72"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD3A3"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#dotGrid)" opacity="0.78"/>
  <text x="600" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#EAFBF7">Architecture Overview</text><text x="600" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#9CC6C0">A local control plane between agents and the workbook surface</text><rect x="70" y="195" width="175" height="105" rx="24" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.3" filter="url(#softShadow)"/><text x="157.5" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#EAFBF7">MCP Client</text><text x="157.5" y="267" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#A5F3FC">Agent / IDE / CLI</text><rect x="310" y="195" width="190" height="105" rx="24" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.3" filter="url(#softShadow)"/><text x="405.0" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#EAFBF7">GridPilot Host</text><text x="405.0" y="267" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#A5F3FC">stdio + routing</text><rect x="565" y="195" width="175" height="105" rx="24" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.3" filter="url(#softShadow)"/><text x="652.5" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#EAFBF7">C# Bridge</text><text x="652.5" y="267" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#A5F3FC">leases + safety</text><rect x="805" y="195" width="175" height="105" rx="24" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.3" filter="url(#softShadow)"/><text x="892.5" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#EAFBF7">COM Adapter</text><text x="892.5" y="267" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#A5F3FC">Excel interop</text><rect x="1030" y="195" width="140" height="105" rx="24" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.3" filter="url(#softShadow)"/><text x="1100.0" y="238" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#EAFBF7">Live Excel</text><text x="1100.0" y="267" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#A5F3FC">workbook</text><path d="M257 247.5 C 277.5 247.5, 277.5 247.5, 298 247.5" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M512 247.5 C 532.5 247.5, 532.5 247.5, 553 247.5" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M752 247.5 C 772.5 247.5, 772.5 247.5, 793 247.5" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M992 247.5 C 1005.0 247.5, 1005.0 247.5, 1018 247.5" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="305" y="355" width="590" height="82" rx="24" fill="#0A1B20" opacity="1" stroke="#24545B" stroke-width="1"/><text x="600" y="389" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#EAFBF7">GridPilot owns routing, permissions, cleanup, retries, diagnostics, and structured failure reporting.</text><text x="600" y="417" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#9CC6C0">Agents get scoped workbook tools instead of an unrestricted desktop automation escape hatch.</text>
</svg>