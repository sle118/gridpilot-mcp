    </text>
  </g>
  <g transform="translate(1054 192)">
    <rect width="88" height="132" rx="20" fill="#0F6A4A"/>
    <text x="44" y="50" text-anchor="middle" fill="#EAF8F2" font-size="15" font-family="JetBrains Mono, Consolas, monospace">LIVE</text>
    <text x="44" y="82" text-anchor="middle" fill="#FFFFFF" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="44" dy="0">Excel</tspan>
