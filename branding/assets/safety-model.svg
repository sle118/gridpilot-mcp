<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="52%" stop-color="#0B1F24"/>
      <stop offset="100%" stop-color="#0E302C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14343B"/>
      <stop offset="100%" stop-color="#0D2429"/>
    </linearGradient>
    <linearGradient id="pilotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79FFE1"/>
      <stop offset="100%" stop-color="#2CD3A3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1B3B40" opacity="0.72"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD3A3"/></marker><marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FACC15"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" rx="28" fill="url(#dotGrid)" opacity="0.78"/>
  <text x="600" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#EAFBF7">Safety Model</text><text x="600" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#9CC6C0">Designed for live desktop workbooks where humans and agents may overlap</text><rect x="80" y="210" width="180" height="88" rx="22" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.5" filter="url(#softShadow)"/><text x="170.0" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">Agent request</text><rect x="315" y="210" width="180" height="88" rx="22" fill="url(#cardGrad)" opacity="1" stroke="#60A5FA" stroke-width="1.5" filter="url(#softShadow)"/><text x="405.0" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">Resolve</text><text x="405.0" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">connectionId</text><rect x="550" y="190" width="150" height="128" rx="22" fill="url(#cardGrad)" opacity="1" stroke="#FACC15" stroke-width="1.5" filter="url(#softShadow)"/><text x="625.0" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">Mutation</text><text x="625.0" y="258" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">lease?</text><rect x="755" y="210" width="180" height="88" rx="22" fill="url(#cardGrad)" opacity="1" stroke="#A78BFA" stroke-width="1.5" filter="url(#softShadow)"/><text x="845.0" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">Validate scope</text><rect x="990" y="210" width="170" height="88" rx="22" fill="url(#cardGrad)" opacity="1" stroke="#2CD3A3" stroke-width="1.5" filter="url(#softShadow)"/><text x="1075.0" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">Controlled</text><text x="1075.0" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#EAFBF7">COM operation</text><path d="M270 254.0 C 287.5 254.0, 287.5 254.0, 305 254.0" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M505 254.0 C 522.5 254.0, 522.5 254.0, 540 254.0" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M710 254.0 C 727.5 254.0, 727.5 254.0, 745 254.0" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M945 254.0 C 962.5 254.0, 962.5 254.0, 980 254.0" fill="none" stroke="#2CD3A3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="475" y="365" width="250" height="72" rx="20" fill="#241A13" opacity="1" stroke="#FACC15" stroke-width="1.3"/><text x="600" y="395" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FACC15">No lease / unsafe UI?</text><text x="600" y="421" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#9CC6C0">Return structured refusal</text><path d="M 625 318 L 625 365" stroke="#FACC15" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowWarn)"/><rect x="380" y="455" width="440" height="48" rx="16" fill="#0A1B20" opacity="1" stroke="#24545B" stroke-width="1"/><text x="600" y="486" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A5F3FC">Mock-first validation. Live Excel automation is opt-in.</text>
</svg>