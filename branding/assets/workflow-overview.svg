<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="360" rx="28" fill="#08131E"/>
  <text x="70" y="78" fill="#F6F7F8" font-size="34" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Normal MCP Workbook Flow</text>
  <text x="70" y="112" fill="#AFC1CC" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">Explicit connection first, then targeted operations using `connectionId`.</text>

  <g transform="translate(70 164)">
    <rect width="176" height="116" rx="18" fill="#0E2432" stroke="#173A4A"/>
    <circle cx="34" cy="32" r="17" fill="#14B88A"/>
    <text x="34" y="38" text-anchor="middle" fill="#08131E" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">1</text>
    <text x="62" y="42" fill="#F6F7F8" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">Start MCP</text>
    <text x="24" y="76" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">Host launches</tspan>
      <tspan x="24" dy="20">lazily.</tspan>
    </text>
  </g>
  <g transform="translate(280 164)">
    <rect width="192" height="116" rx="18" fill="#0E2432" stroke="#173A4A"/>
    <circle cx="34" cy="32" r="17" fill="#14B88A"/>
    <text x="34" y="38" text-anchor="middle" fill="#08131E" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">2</text>
    <text x="62" y="42" fill="#F6F7F8" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">List workbooks</text>
    <text x="24" y="76" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">See live candidates</tspan>
      <tspan x="24" dy="20">first.</tspan>
    </text>
  </g>
  <g transform="translate(506 164)">
    <rect width="194" height="116" rx="18" fill="#0E2432" stroke="#173A4A"/>
    <circle cx="34" cy="32" r="17" fill="#14B88A"/>
    <text x="34" y="38" text-anchor="middle" fill="#08131E" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">3</text>
    <text x="62" y="42" fill="#F6F7F8" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">Connect</text>
    <text x="24" y="76" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">Get a durable</tspan>
      <tspan x="24" dy="20">`connectionId`.</tspan>
    </text>
  </g>
  <g transform="translate(734 164)">
    <rect width="194" height="116" rx="18" fill="#0E2432" stroke="#173A4A"/>
    <circle cx="34" cy="32" r="17" fill="#14B88A"/>
    <text x="34" y="38" text-anchor="middle" fill="#08131E" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">4</text>
    <text x="62" y="42" fill="#F6F7F8" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">Operate</text>
    <text x="24" y="76" fill="#AFC1CC" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">Read, mutate,</tspan>
      <tspan x="24" dy="20">diagnose, save.</tspan>
    </text>
  </g>
  <g transform="translate(962 164)">
    <rect width="168" height="116" rx="18" fill="#0F6A4A" stroke="#30C48D"/>
    <circle cx="34" cy="32" r="17" fill="#F6F7F8"/>
    <text x="34" y="38" text-anchor="middle" fill="#0F6A4A" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">5</text>
    <text x="62" y="42" fill="#FFFFFF" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif">Persist</text>
    <text x="24" y="76" fill="#E7F8F0" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">
      <tspan x="24" dy="0">Keep changes</tspan>
      <tspan x="24" dy="20">deliberate.</tspan>
    </text>
  </g>

  <g stroke="#22D3EE" stroke-width="4" stroke-linecap="round">
    <path d="M246 222H270"/>
    <path d="M472 222H496"/>
    <path d="M700 222H724"/>
    <path d="M928 222H952"/>
  </g>
  <g fill="#22D3EE">
    <path d="M270 222L258 215V229L270 222Z"/>
    <path d="M496 222L484 215V229L496 222Z"/>
    <path d="M724 222L712 215V229L724 222Z"/>
