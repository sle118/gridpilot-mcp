      <tspan x="256" dy="0">Operate live workbooks</tspan>
      <tspan x="256" dy="58">through a controlled,</tspan>
      <tspan x="256" dy="58">safety-aware MCP host</tspan>
    </text>
    <text x="260" y="332" fill="#D6DEE5" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif">
